<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
</head>
<body>

    <h1>Contact Me</h1>

    <form action="#" method="POST">
        <!-- Personal Info -->
        <div>
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" name="firstName" required>
        </div>
        <br>
        <div>
            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName" required>
        </div>
        <br>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <br>

        <!-- Country -->
        <div>
            <label for="country">Country:</label>
            <select id="country" name="country">
                <option value="bangladesh">Bangladesh</option>
                <option value="other">Other</option>
                <option value="uk">UK</option>
                <option value="usa">USA</option>
            </select>
        </div>
        <br>

        <!-- Reason of Contact -->
        <div>
            <p>Reason of Contact:</p>
            <input type="radio" id="job" name="reason" value="job">
            <label for="job">Job</label><br>
            
            <input type="radio" id="project" name="reason" value="project">
            <label for="project">Project</label><br>
            
            <input type="radio" id="research" name="reason" value="research">
            <label for="research">Research</label>
        </div>
        <br>

        <!-- Domain -->
        <div>
            <p>Domain:</p>
            <input type="checkbox" id="webDev" name="domain" value="web">
            <label for="webDev">Web Development</label><br>
            
            <input type="checkbox" id="aiMl" name="domain" value="ai_ml">
            <label for="aiMl">AI/ML Development</label><br>
            
            <input type="checkbox" id="mobileDev" name="domain" value="mobile">
            <label for="mobileDev">Mobile Development</label>
        </div>
        <br>

        <!-- Message & Date -->
        <div>
            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="4" cols="50"></textarea>
        </div>
        <br>
        <div>
            <label for="appointmentDate">Appointment Date:</label>
            <input type="date" id="appointmentDate" name="appointmentDate">
        </div>
        <br>

        <!-- Submit & Reset -->
        <div>
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </div>
    </form>

</body>
</html>
