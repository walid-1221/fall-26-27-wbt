<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation Form</title>
</head>
 
<body>
 
    <h2>Donor Information</h2>
 
    <form>
        <table>
            <tr>
                <td><label for="firstName">First Name</label></td>
                <td><input type="text" id="firstName" name="firstName" required></td>
            </tr>
 
            <tr>
                <td><label for="lastName">Last Name</label></td>
                <td><input type="text" id="lastName" name="lastName" required></td>
            </tr>
 
            <tr>
                <td><label for="company">Company</label></td>
                <td><input type="text" id="company" name="company"></td>
            </tr>
 
            <tr>
                <td><label for="address1">Address 1</label></td>
                <td><input type="text" id="address1" name="address1" required></td>
            </tr>
 
            <tr>
                <td><label for="address2">Address 2</label></td>
                <td><input type="text" id="address2" name="address2"></td>
            </tr>
 
            <tr>
                <td><label for="city">City</label></td>
                <td><input type="text" id="city" name="city" required></td>
            </tr>
 
            <tr>
                <td><label for="state">State</label></td>
                <td>
                    <select id="state" name="state" required>
                        <option value="">Select a State</option>
                        <option>California</option>
                        <option>Florida</option>
                        <option>New York</option>
                        <option>Texas</option>
                    </select>
                </td>
            </tr>
 
            <tr>
                <td><label for="zip">Zip Code</label></td>
                <td><input type="text" id="zip" name="zip" required></td>
            </tr>
 
            <tr>
                <td><label for="country">Country</label></td>
                <td>
                    <select id="country" name="country" required>
                        <option value="">Select a Country</option>
                        <option>Bangladesh</option>
                        <option>India</option>
                        <option>United Kingdom</option>
                        <option>United States</option>
                    </select>
                </td>
            </tr>
 
            <tr>
                <td><label for="phone">Phone</label></td>
                <td><input type="tel" id="phone" name="phone"></td>
            </tr>
 
            <tr>
                <td><label for="fax">Fax</label></td>
                <td><input type="text" id="fax" name="fax"></td>
            </tr>
 
            <tr>
                <td><label for="email">Email</label></td>
                <td><input type="email" id="email" name="email" required></td>
            </tr>
 
            <tr>
                <td><label>Donation Amount</label><br>(Check a button or type in your amount)</td>
                <td>
                    <input type="radio" name="amount" value="0" checked> None
                    <input type="radio" name="amount" value="50"> $50
                    <input type="radio" name="amount" value="75"> $75
                    <input type="radio" name="amount" value="100"> $100
                    <input type="radio" name="amount" value="250"> $250
                    <input type="radio" name="amount" value="other"> Other
                </td>
            </tr>
 
            <tr>
                <td></td>
                <td><label for="otherAmount">Other Amount $</label>
                    <input type="number" id="otherAmount" name="otherAmount">
                </td>
            </tr>
 
            <tr>
                <td>Recurring Donation <br>(Check if yes)</td>
                <td>
                    <input type="checkbox" id="recurring" name="recurring">
                    I am interested in giving on a regular basis.
 
                </td>
            </tr>
 
            <tr>
                <td></td>
                <td><label for="monthlyAmount">Monthly Credit Card $</label>
 
                    <input type="number" id="monthlyAmount" name="monthlyAmount">
                    For
                    <input type="number" id="months" name="months">
                    Months
                </td>
            </tr>
        </table>
 
        <h2>Honorarium and Memorial Donation Information</h2>
 
        <table>
            <tr>
                <td>I would like to make this donation</td>
                <td>
                    <input type="radio" name="donationType" value="honor"> To Honor<br>
                    <input type="radio" name="donationType" value="memorial"> In Memory of
                </td>
            </tr>
 
            <tr>
                <td><label for="honoreeName">Name</label></td>
                <td><input type="text" id="honoreeName" name="honoreeName"></td>
            </tr>
 
            <tr>
                <td><label for="acknowledge">Acknowledge Donation to</label></td>
                <td><input type="text" id="acknowledge" name="acknowledge"></td>
            </tr>
 
            <tr>
                <td><label for="memorialAddress">Address</label></td>
                <td><input type="text" id="memorialAddress" name="memorialAddress"></td>
            </tr>
 
            <tr>
                <td><label for="memorialCity">City</label></td>
                <td><input type="text" id="memorialCity" name="memorialCity"></td>
            </tr>
 
            <tr>
                <td><label for="memorialState">State</label></td>
                <td>
                    <select id="memorialState" name="memorialState">
                        <option value="">Select a State</option>
                        <option>California</option>
                        <option>Florida</option>
                        <option>New York</option>
                        <option>Texas</option>
                    </select>
                </td>
            </tr>
 
            <tr>
                <td><label for="memorialZip">Zip</label></td>
                <td><input type="text" id="memorialZip" name="memorialZip"></td>
            </tr>
        </table>
       
    </form>
 
</body>
 
</html>
